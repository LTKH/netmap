syntax = "proto3";

package events;

// Укажите путь, который будет использоваться для импорта сгенерированного кода
option go_package = "github.com/ltkh/netmap/grpc";

// Сообщение события
message Event {
  string message = 1;
  int64 timestamp = 2;
}

// Запрос для подписки (может быть пустым)
service EventService {
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}

message SubscribeRequest {
  // Можно добавить фильтры или параметры подписки
}